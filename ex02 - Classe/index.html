<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy - Ex02 Classe</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Folha de Estilos -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Cabeçalho -->
        <header class="page-header">
            <a href="../index.html" class="back-link">← Voltar ao Menu</a>
            <h1>DevTech Academy</h1>
            <p class="subtitle">Exercício 02: Orientação a Objetos com a Classe Aluno</p>
        </header>

        <!-- Card de Cadastro -->
        <section class="card">
            <div class="card-header">
                <h2>Cadastro de Aluno</h2>
                <p class="card-description">Preencha os dados abaixo para instanciar e gerenciar um objeto Aluno.</p>
            </div>

            <form id="formAluno" onsubmit="return false;">
                <div class="form-grid">
                    <div class="form-group col-span-2">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Ex: Maria Silva" required>
                    </div>

                    <div class="form-group">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" min="1" placeholder="Ex: 21" required>
                    </div>

                    <div class="form-group">
                        <label for="curso">Curso</label>
                        <select id="curso">
                            <option value="JavaScript">JavaScript</option>
                            <option value="Python">Python</option>
                            <option value="Java">Java</option>
                        </select>
                    </div>

                    <div class="form-group col-span-2">
                        <label for="notaFinal">Nota Final (0 a 10)</label>
                        <input type="number" id="notaFinal" min="0" max="10" step="0.1" placeholder="Ex: 8.5" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="btnSalvar" class="btn btn-primary" onclick="salvarAluno()">Cadastrar</button>
                    <button type="button" class="btn btn-secondary" onclick="limparFormulario()">Limpar</button>
                </div>
            </form>
        </section>

        <!-- Card da Tabela de Registros -->
        <section class="card">
            <div class="card-header">
                <h2>Alunos Cadastrados</h2>
                <p class="card-description">Instâncias da classe Aluno armazenadas na memória.</p>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Idade</th>
                            <th>Curso</th>
                            <th>Nota Final</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaAlunos"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="aluno.js"></script>
    <script src="script.js"></script>
</body>

</html>
